name: Build Android APK

# Builds a debug-signed AbayBids APK (installable straight away, no extra
# setup needed) whenever android/ changes, and lets you trigger it manually
# from the Actions tab. Download it from the workflow run's "Artifacts"
# section when it finishes.
on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbayBids-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
