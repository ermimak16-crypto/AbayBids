[package]
name = "abaybids"
version = "1.0.0"
description = "Abay Technical & Trading s.c | Smart Tender System"
authors = ["Abay Technical & Trading s.c"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keeps the app as a single running instance (clicking the desktop
# shortcut again just focuses the existing window instead of opening a
# second copy).
tauri-plugin-single-instance = "2"

[[bin]]
name = "abaybids"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
